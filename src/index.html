<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Lazaro Guerra · Ingeniero Backend Java</title>
  <meta name="description" content="Portafolio de Lazaro Guerra, ingeniero backend con Java, Spring Boot, Kafka, PostgreSQL y AWS.">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="favicon.png" sizes="192x192">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <script>
    // Apply the saved theme before first paint so dark mode never flashes light (see ThemeService).
    try {
      if (localStorage.getItem('portfolio.theme') === 'dark') {
        document.documentElement.dataset.theme = 'dark';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#ffffff');
      }
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>

name: Deploy to GitHub Pages

# Every push to main (git flow releases and hotfixes) is verified and published to
# https://lazarodevelop.github.io/portfolio-website/. Can also be run by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (headless Chrome)
        run: npm run test:ci

      - name: Build for GitHub Pages
        # The site is served from /portfolio-website/, so assets and routes need that base href.
        run: npm run build:pages

      - name: Prepare SPA fallback
        # GitHub Pages has no rewrites: serving index.html as 404.html lets deep links such as
        # /projects/<slug> load the app, which then routes on the client.
        run: |
          cp dist/portfolio-website/browser/index.html dist/portfolio-website/browser/404.html
          touch dist/portfolio-website/browser/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/portfolio-website/browser

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
